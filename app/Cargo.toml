[package]
name = "dashbeam-lite"
version = "0.8.0"
description = "P2P file sharing with NAT hole punching"
authors = ["Tony Antony"]
license = "AGPL-3.0-only"
edition = "2021"
rust-version = "1.91"

[dependencies]
engine = { path = "../engine" }
gpui-kit = "0.8"
gpui-tray = { version = "0.3", default-features = false, features = ["gpui-kit", "menu-state"] }
iroh-blobs = "0.103.1"
mime_guess = "2.0"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["rt-multi-thread", "sync", "time", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
walkdir = "2.4"
dirs = "6.0"
anyhow = "1.0"
