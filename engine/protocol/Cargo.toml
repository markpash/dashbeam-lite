[package]
name = "sendme-protocol"
version = "0.1.0"
edition = "2021"
authors = ["Tony Antony <tonyantony300@gmail.com>"]
license = "AGPL-3.0-only"
repository = "https://github.com/tonyantony300/dashbeam"
description = "Shared P2P transfer protocol for dashbeam (iroh, metadata, progress)"
rust-version = "1.91"

[lib]
name = "protocol"

[dependencies]
anyhow = "1.0.75"
data-encoding = "2.8.0"
bytes = "=1.11.1"
derive_more = { version = "2.0.1", features = ["display", "from_str"] }
n0-future = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.108"
tracing = "0.1.40"
url = "2"

iroh-blobs = { version = "0.103.1" }
iroh = { version = "1.3.0", features = ["platform-verifier"] }
tokio = { version = "1.34.0", features = ["full"] }
