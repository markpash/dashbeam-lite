[package]
name = "engine"
version = "0.1.0"
edition = "2021"
authors = ["Tony Antony <tonyantony300@gmail.com>"]
keywords = ["scp", "sftp", "network", "p2p", "holepunching"]
categories = ["network-programming"]
license = "AGPL-3.0-only"
repository = "https://github.com/tonyantony300/dashbeam"
description = "DashBeam - Frictionless peer-to-peer file transfer desktop application with NAT hole punching"
readme = "README.md"
rust-version = "1.91"

[lib]
name = "engine"


[dependencies]
protocol = { path = "protocol", package = "sendme-protocol" }
native = { path = "native", package = "sendme-native" }

[dev-dependencies]
anyhow = "1.0.75"
duct = "0.13.6"
nix = { version = "0.29", features = ["signal", "process"] }
rand = "0.10"
serde_json = "1.0.108"
tempfile = "3.8.1"
tokio = { version = "1.34.0", features = ["full"] }
iroh = { version = "1.3.0", features = ["platform-verifier"] }
iroh-blobs = { version = "0.103.1" }
data-encoding = "2.8.0"


[features]
# The Nearby E2E suite needs two nodes to form a direct path within seconds,
# which shared CI runners can't promise. Run it locally with
# `cargo test -p engine --features nearby-tests`.
nearby-tests = []

[[test]]
name = "test_nearby"
required-features = ["nearby-tests"]
